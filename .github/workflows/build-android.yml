
name: Build PMR Emergency V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Buat proyek Flutter
        run: |
          flutter create --platforms=android --project-name pmr_emergency_v2 app
          cp lib/main.dart app/lib/main.dart
          rm -rf app/test

      - name: Pasang konfigurasi Firebase
        run: |
          cp google-services.json app/android/app/google-services.json

      - name: Aktifkan Google Services
        run: |
          sed -i '/id("org.jetbrains.kotlin.android")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' app/android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' app/android/app/build.gradle.kts

      - name: Atur izin Android
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' app/android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' app/android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' app/android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' app/android/app/src/main/AndroidManifest.xml

      - name: Tambahkan paket
        run: |
          cd app
          flutter pub add supabase_flutter
          flutter pub add firebase_core
          flutter pub add firebase_messaging
          flutter pub add flutter_local_notifications
          flutter pub add geolocator

      - name: Periksa Package ID
        run: |
          grep -R "applicationId" app/android/app/

      - name: Periksa kode
        run: |
          cd app
          flutter analyze --no-fatal-infos

      - name: Bangun APK
        run: |
          cd app
          flutter build apk --release

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: PMR-EMERGENCY-V2-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
